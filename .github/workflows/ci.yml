name: CI

on:
  push:
    branches: [main, day3/**, day4/**]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python -m pytest tests/unit/ -v --tb=short

      - name: Run integration tests (correctness only)
        run: |
          python -m pytest tests/integration/test_benchmark.py::TestPartitionLogBenchmark::test_read_ordering_guarantee_across_segments \
            tests/integration/test_benchmark.py::TestPartitionLogBenchmark::test_durability_after_restart_simulation \
            -v --tb=short

  benchmark:
    name: Throughput Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run throughput benchmark
        run: |
          python -m pytest tests/integration/test_benchmark.py::TestPartitionLogBenchmark::test_append_throughput_sustained \
            tests/integration/test_benchmark.py::TestPartitionLogBenchmark::test_read_throughput \
            -v --tb=short -s
        env:
          PYTHONUNBUFFERED: 1

  cache-correctness:
    name: LRU Cache Correctness
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run LRU cache correctness tests
        run: |
          python -m pytest tests/unit/test_lru_cache.py::TestLRUCacheCorrectness \
            -v --tb=short

      - name: Run cache integration tests
        run: |
          python -m pytest tests/unit/test_lru_cache.py::TestSegmentCacheIntegration \
            -v --tb=short

      - name: Run cache-consistency guarantee test (stale read prevention)
        run: |
          python -c "
from services.broker.lru_cache import LRUCache

# Critical test: Prove no stale reads after eviction
cache = LRUCache[int, str](capacity=2)
cache.put(1, 'value-1')
cache.put(2, 'value-2')
cache.put(3, 'value-3')  # Evicts 1

# Key 1 must be completely gone - no stale read possible
assert cache.get(1) is None, 'STALE READ DETECTED: Evicted key 1 returned value'
assert 1 not in cache, 'STALE READ DETECTED: Evicted key 1 still in cache'

# Keys 2 and 3 should still be accessible
assert cache.get(2) == 'value-2'
assert cache.get(3) == 'value-3'

print('✓ Cache-consistency guarantee verified: No stale reads after eviction')
"

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t streamcore-broker -f docker/Dockerfile .

      - name: Test Docker image runs
        run: |
          docker run --rm streamcore-broker python -c "
from services.broker.partition_log import PartitionLog
from services.broker.lru_cache import LRUCache, SegmentCache
print('✓ All imports successful in Docker image')
"

  docker-push:
    name: Docker Push to Registry
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test, benchmark, cache-correctness, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/broker
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max