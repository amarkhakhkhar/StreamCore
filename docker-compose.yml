version: '3.8'

services:
  broker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: streamcore-broker
    ports:
      - "8000:8000"
    volumes:
      # Mountable volume for segment durability
      - streamcore-data:/data/logs
    environment:
      - STREAMCORE_LOG_DIR=/data/logs
      - STREAMCORE_SEGMENT_SIZE=1048576  # 1MB segments for testing
      - STREAMCORE_PORT=8000
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  streamcore-data:
    driver: local
